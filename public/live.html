<!doctype html>
<html lang="de" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="robots" content="noindex, nofollow">
  <title>Live · Rundown</title>
  <link rel="icon" href="/img/icon.svg" type="image/svg+xml">
  <link rel="icon" href="/img/favicon-64.png" type="image/png" sizes="64x64">
  <link rel="apple-touch-icon" href="/img/icon-180.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="preload" href="/fonts/ibm-plex-sans-var.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/barlow-condensed-700.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/css/fonts.css">
  <link rel="stylesheet" href="/css/app.css">
  <script>document.documentElement.dataset.theme = localStorage.getItem('ffr.theme') || 'dark';</script>
  <style>
    html, body { height: 100%; overflow: hidden; }
    .lw { height: 100%; display: flex; flex-direction: column; }

    /* Kopfzeile */
    .lw-top { flex: none; display: flex; align-items: center; gap: 14px; height: 60px; padding: 0 max(16px, 2vw); border-bottom: 1px solid var(--border); background: var(--glass); backdrop-filter: blur(14px); }
    .lw-top > .ico { width: 26px; height: 26px; }
    .lw-title { min-width: 0; flex: 1; line-height: 1.15; }
    .lw-title .t { font-family: var(--font-cond); font-weight: 700; font-size: 21px; text-transform: uppercase; letter-spacing: .02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .lw-title .s { font-size: 13px; color: var(--text-2); }
    .lw-clock { display: inline-flex; align-items: center; gap: 7px; font-family: var(--font-mono); font-size: 16px; font-weight: 500; padding-right: 14px; border-right: 1px solid var(--border-2); }
    .lw-clock .ico { width: 15px; height: 15px; color: var(--text-2); }

    .lw-body { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 14px; padding: 14px 12px 12px; }

    /* Statuskarte */
    .lw-status { flex: none; display: flex; align-items: center; gap: 24px; padding: 14px 18px 14px 18px; }
    .lw-status .left { flex: 1; min-width: 0; }
    .lw-status .progress { margin: 0 0 12px; height: 9px; }
    .lw-line { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; letter-spacing: .03em; text-transform: uppercase; color: var(--text-2); }
    .lw-line b { color: var(--text); font-weight: 500; }
    .lw-line .green, .lw-line .green b { color: var(--green-text); }
    .lw-line .red, .lw-line .red b { color: var(--red-text); }
    .lw-rest { text-align: right; flex: none; }
    .lw-rest .lbl { font-size: 11px; letter-spacing: .14em; color: var(--text-2); text-transform: uppercase; font-weight: 600; }
    .lw-rest .v { font-family: var(--font-mono); font-weight: 600; font-size: 34px; line-height: 1.1; font-variant-numeric: tabular-nums; }
    .lw-rest .v.warn { color: var(--yellow); }
    .lw-rest .v.over { color: var(--red-text); }

    /* Tabelle */
    .lw-table { flex: 1; min-height: 0; overflow: auto; padding: 0 20px 16px; background: var(--table-bg); border-radius: 18px; }
    .lw-status { border-radius: 18px; }
    .lw-head { background: var(--table-bg); }
    .lw-grid { min-width: 900px; }
    .lw-row { display: grid; grid-template-columns: var(--cols); gap: 7px; }
    .lw-head { position: sticky; top: 0; z-index: 2; background: var(--bg-2); padding: 30px 0 12px; font-family: var(--font-cond); font-weight: 700; font-size: 14px; letter-spacing: .05em; text-transform: uppercase; color: var(--text-2); }
    .lw-head > div.center { text-align: center; }
    .lw-rows { display: flex; flex-direction: column; gap: 9px; }
    .lw-c { background: var(--c, var(--cell)); color: var(--cell-text); border-radius: 9px; padding: 12px 12px; min-width: 0; display: flex; flex-direction: column; justify-content: center; position: relative; transition: opacity .2s, box-shadow .2s; }
    .has-color .lw-c { color: #fff; }
    .lw-c.center { align-items: center; text-align: center; padding: 8px 4px; }
    .lw-c .num { font-size: 18px; font-variant-numeric: tabular-nums; }
    .lw-c .dur { font-size: 18px; font-variant-numeric: tabular-nums; }
    .lw-c .delta { font-size: 13px; margin-top: 1px; min-height: 0; }
    .lw-c .t1 { font-weight: 600; font-size: 18px; line-height: 1.35; white-space: pre-wrap; overflow-wrap: anywhere; }
    .lw-c .t2 { font-weight: 600; font-size: 17px; margin-top: 22px; white-space: pre-wrap; overflow-wrap: anywhere; }
    .lw-c .t2:empty { display: none; }
    .lw-c .tx { font-size: 15px; line-height: 1.4; white-space: pre-wrap; overflow-wrap: anywhere; }
    .lw-c .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; border-radius: 0 0 9px 9px; overflow: hidden; display: none; }
    .lw-c .bar span { display: block; height: 100%; width: 0; background: var(--green); transition: width .25s linear; }
    .lw-item.is-live .lw-c { box-shadow: 0 0 0 2px var(--green); }
    .lw-item.is-live .lw-c .bar { display: block; }
    .lw-item.is-live.over .lw-c { box-shadow: 0 0 0 2px var(--red); }
    .lw-item.is-live.over .lw-c .bar span { background: var(--red); }
    .lw-item.is-live .nrc { background: var(--green); color: #04130a; }
    .lw-item.is-live.over .nrc { background: var(--red); color: #fff; }
    .lw-item.is-next .nrc { box-shadow: inset 0 0 0 2px var(--yellow); }
    .lw-item.is-done .lw-c { opacity: .45; }
    .hide-done .lw-item.is-done { display: none; }
    .lw-block { padding: 24px 22px 8px; font-family: var(--font-cond); font-weight: 700; font-size: 20px; letter-spacing: .03em; text-transform: uppercase; display: flex; align-items: center; gap: 10px; }
    .lw-block .dot { width: 10px; height: 10px; border-radius: 3px; background: var(--c); }
    .lw-block .meta { font-family: var(--font); font-weight: 400; font-size: 13px; letter-spacing: 0; text-transform: none; color: var(--text-2); }
    .compact .lw-c { padding: 6px 10px; }
    .compact .lw-c .t1, .compact .lw-c .num, .compact .lw-c .dur { font-size: 15px; }
    .compact .lw-c .t2 { margin-top: 4px; font-size: 14px; }
    .compact .lw-c .tx { font-size: 13px; }
    .compact .lw-rows { gap: 5px; }
    .compact .lw-block { padding: 14px 22px 4px; font-size: 17px; }

    /* Countdown-Modus */
    .lw-big { flex: 1; min-height: 0; display: none; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 2vh 3vw; transition: background .4s; }
    .mode-countdown .lw-big { display: flex; }
    .mode-countdown .lw-status, .mode-countdown .lw-table { display: none; }
    .lw-big.over { background: radial-gradient(1200px 600px at 50% 50%, rgba(239, 68, 68, .2), transparent 70%); }
    .lw-big .lbl { font-family: var(--font-cond); font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--text-2); font-size: clamp(14px, 1.6vw, 26px); }
    .lw-big .name { font-family: var(--font-cond); font-weight: 700; text-transform: uppercase; font-size: clamp(32px, 6vw, 110px); line-height: 1; margin: 6px 0 2px; overflow-wrap: anywhere; }
    .lw-big .desc { font-size: clamp(15px, 2vw, 32px); color: var(--text-2); white-space: pre-wrap; }
    .lw-big .count { font-family: var(--font-mono); font-weight: 600; font-variant-numeric: tabular-nums; font-size: clamp(80px, 19vw, 380px); line-height: .95; margin-top: 2vh; color: var(--green-text); }
    .lw-big .count.warn { color: var(--yellow); }
    .lw-big .count.over { color: var(--red-text); animation: blink 1s steps(2, start) infinite; }
    .lw-big .count.idle { color: var(--muted); }
    .lw-big .progress { width: min(1300px, 90vw); margin-top: 3vh; height: 12px; }
    .lw-big .nx { margin-top: 4vh; font-size: clamp(15px, 1.8vw, 28px); color: var(--text-2); }
    .lw-big .nx b { color: var(--text); font-family: var(--font-cond); text-transform: uppercase; font-size: 1.3em; }
    @keyframes blink { 50% { opacity: .55; } }

    .lw-msg { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px; color: var(--text-2); font-size: 17px; }
    .lw-msg a { color: var(--text); text-decoration: underline; }

    @media (max-width: 760px) {
      .lw-top { padding: 0 10px; gap: 8px; height: 56px; }
      .lw-title .t { font-size: 17px; }
      .lw-clock { font-size: 14px; padding-right: 8px; }
      .lw-top .btn .lbl { display: none; }
      .lw-body { padding: 8px; gap: 8px; }
      .lw-status { flex-direction: column; align-items: stretch; gap: 8px; padding: 12px; }
      .lw-rest { display: flex; align-items: baseline; justify-content: space-between; }
      .lw-rest .v { font-size: 28px; }
      .lw-table { padding: 0 8px 8px; }
      .lw-title .s { display: none; }
      .lw-grid { min-width: 0 !important; }
      .lw-head { display: none; }
      .lw-rows { padding-top: 8px; }
      .lw-item { grid-template-columns: repeat(4, 1fr) !important; gap: 5px; padding-bottom: 9px; border-bottom: 1px solid var(--border); }
      .lw-item .ttl, .lw-item .txc { grid-column: 1 / -1; }
      .lw-item .empty-c { display: none; }
      .lw-c.center::before, .lw-c.txc::before { content: attr(data-label); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; opacity: .6; font-family: var(--font-cond); font-weight: 700; margin-bottom: 2px; }
      .lw-c .num, .lw-c .dur { font-size: 15px; }
      .lw-c .t1 { font-size: 16px; }
      .lw-c .t2 { margin-top: 6px; font-size: 14px; }
      .lw-block { padding: 14px 6px 2px; font-size: 17px; flex-wrap: wrap; }
    }
    /* ===== Handy & Tablet: Karten statt Tabelle ===== */
    @media (max-width: 900px) {
      .lw-top { padding: 0 12px; gap: 10px; }
      .lw-head { display: none; }
      .lw-grid { min-width: 0 !important; }
      .lw-table { padding: 10px; }
      .lw-rows { padding-top: 0; gap: 10px; }
      .lw-item {
        grid-template-columns: auto auto auto 1fr auto !important;
        gap: 6px 10px; align-items: center; position: relative;
        padding: 10px 14px 12px 10px; border-radius: 14px; border-bottom: 0 !important;
        background: var(--c, var(--cell)); color: var(--cell-text); transition: box-shadow .2s, opacity .2s;
      }
      .lw-item.has-color { color: #fff; }
      .lw-item > .lw-c { background: transparent !important; padding: 0 !important; border-radius: 0; box-shadow: none !important; opacity: 1 !important; position: static; color: inherit; }
      .lw-item > .lw-c::before { content: none !important; }
      .lw-item > .nrc { grid-column: 1; grid-row: 1; width: 34px; height: 34px; border-radius: 9px; background: rgba(255, 255, 255, .13) !important; }
      :root[data-theme='light'] .lw-item:not(.has-color) > .nrc { background: rgba(0, 0, 0, .08) !important; }
      .lw-item > .c-start { grid-column: 2; grid-row: 1; }
      .lw-item > .c-end { grid-column: 3; grid-row: 1; flex-direction: row !important; }
      .lw-item > .c-end::before { content: '– ' !important; display: inline !important; opacity: .6; margin: 0 4px 0 -6px; font: inherit; letter-spacing: 0; }
      .lw-item > .c-start .num, .lw-item > .c-end .num { font-size: 15px; opacity: .85; }
      .lw-item > .c-dur { grid-column: 5; grid-row: 1; align-items: flex-end !important; text-align: right; }
      .lw-item > .c-dur .dur { font-size: 17px; }
      .lw-item > .ttl { grid-column: 1 / -1; grid-row: 2; padding-top: 4px !important; }
      .lw-item .t1 { font-size: 18px; }
      .lw-item .t2 { margin-top: 4px; font-size: 15px; }
      .lw-item > .txc { grid-column: 1 / -1; display: grid !important; grid-template-columns: 78px 1fr; gap: 10px; padding-top: 7px !important; border-top: 1px solid rgba(255, 255, 255, .1); }
      :root[data-theme='light'] .lw-item:not(.has-color) > .txc { border-top-color: rgba(0, 0, 0, .08); }
      .lw-item > .txc::before { content: attr(data-label) !important; display: block !important; font-family: var(--font-cond); font-weight: 700; font-size: 12px; letter-spacing: .07em; text-transform: uppercase; opacity: .6; padding-top: 2px; margin: 0; }
      .lw-item > .txc .tx { font-size: 14.5px; }
      .lw-item > .empty-c { display: none !important; }
      .lw-item .bar { left: 0; right: 0; bottom: 0; height: 4px; border-radius: 0 0 14px 14px; }
      .lw-item.is-live { box-shadow: 0 0 0 2px var(--green), 0 0 18px color-mix(in srgb, var(--green) 25%, transparent); }
      .lw-item.is-live.over { box-shadow: 0 0 0 2px var(--red), 0 0 18px color-mix(in srgb, var(--red) 25%, transparent); }
      .lw-item.is-live > .nrc { background: var(--green) !important; color: #04130a; }
      .lw-item.is-live.over > .nrc { background: var(--red) !important; color: #fff; }
      .lw-item.is-next > .nrc { box-shadow: inset 0 0 0 2px var(--yellow) !important; }
      .lw-item.is-done { opacity: .45; }
      .lw-block { padding: 14px 4px 0; font-size: 18px; flex-wrap: wrap; }
      .compact .lw-item { padding: 7px 12px 8px 8px; }
      .compact .lw-item .t1 { font-size: 16px; }
    }
    @media (min-width: 601px) and (max-width: 900px) {
      .lw-rows { max-width: 760px; margin: 0 auto; }
      .lw-item .t1 { font-size: 20px; }
    }
    @media (max-width: 600px) {
      .lw-status { position: relative; }
      .lw-rest .v { font-size: 30px; }
      .lw-line > span:nth-child(2) { display: none; }
    }
    .lw-rows.following { padding-bottom: 75vh; }
  </style>
</head>
<body>
  <script type="module" src="/js/live.js"></script>
</body>
</html>
